server.port=9090

#Enables the H2 database console,
# which provides a web-based interface to interact with the H2 database
spring.h2.console.enabled=true

spring.h2.console.path=/h2

#Sets the JDBC URL for the H2 database.
# In this case, we are using an in-memory database with the name "backenddb".
spring.datasource.url=jdbc:h2:mem:backenddb

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#Sets the Hibernate dialect for the H2 database.
# This property ensures that Hibernate generates appropriate SQL statements compatible with H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#Configures Hibernate to automatically update the database schema based on the entity classes.
spring.jpa.hibernate.ddl-auto=update

#Enables the printing of SQL statements executed by Hibernate in the console.
# This property helps in debugging and understanding the underlying SQL queries.
spring.jpa.show-sql=true